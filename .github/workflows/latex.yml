name: Build LaTeX Monograph

on:
  push:
    paths:
      - 'notes/latex/**'
      - '.github/workflows/latex.yml'
  pull_request:
    paths:
      - 'notes/latex/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: notes/latex
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Upload PDF Artifact (CI Archive)
        uses: actions/upload-artifact@v4
        with:
          name: bosonize-latex-monograph
          path: notes/latex/main.pdf
          if-no-files-found: error

      - name: Publish Direct PDF to Latest Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp notes/latex/main.pdf bosonize-monograph.pdf
          gh release create latest bosonize-monograph.pdf \
            --title "Bosonize-Lean Monograph (Latest Build)" \
            --notes "Continuous automated build of the Bosonize-Lean LaTeX monograph (Chapters 1–11 and Appendices A01–A04). Direct download of the uncompressed PDF is available below." \
            --clobber
